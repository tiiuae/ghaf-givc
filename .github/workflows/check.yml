name: check
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  run-checks:
    runs-on: ${{ matrix.os }}
    concurrency:
      group: nix-checks-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "x86_64-linux"
            os: "ubuntu-latest"
          - arch: "aarch64-linux"
            os: "ubuntu-24.04-arm"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Platform
        run: uname -a
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check .nix formatting
        run: nix fmt -- --fail-on-change
      - name: Check flake
        run: nix flake check --no-build --system ${{ matrix.arch }}
      - name: Build all packages
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          mapfile -t names < <(
            nix eval --raw ".#packages.$arch" \
              --apply 'ps: builtins.concatStringsSep "\n" (builtins.attrNames ps)'
          )
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No packages found under .#packages.$arch" >&2
            exit 1
          fi
          installables=()
          for name in "${names[@]}"; do
            installables+=(".#packages.$arch.$name")
          done
          echo "Building ${#installables[@]} packages: ${installables[*]}"
          nix build --no-link --print-build-logs "${installables[@]}"
