name: Amend Dependabot Cargo PRs

on:
  pull_request:
    paths:
      - 'Cargo.lock'

jobs:
  amend:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check whether any pinned git revision moved
        id: guard
        run: |
          set -euo pipefail
          locked=$(sed -nE 's|^source = "git\+(.*)"$|\1|p' Cargo.lock | sort)
          pinned=$(sed -nE 's|^[[:space:]]*"git\+([^"]*)".*|\1|p' nixos/packages/givc-admin.nix | sort)
          if [ "$locked" = "$pinned" ]; then
            echo "outputHashes pins are up to date, nothing to amend"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install nix
        if: steps.guard.outputs.stale == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Replace cargo git dependency output hashes
        if: steps.guard.outputs.stale == 'true'
        run: |
          nix shell nixpkgs#nix-prefetch-git --command ./scripts/update-outputHashes.sh

      - name: Commit & push changes
        if: steps.guard.outputs.stale == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- nixos/packages/givc-admin.nix; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.email "<49699333+dependabot[bot]@users.noreply.github.com>"
          git config user.name "dependabot[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add nixos/packages/givc-admin.nix
          # [dependabot skip] lets dependabot auto-rebase the PR
          git commit -m "chore(deps): update outputHashes for updated Cargo git dependencies [dependabot skip]"
          git push origin HEAD:${{ github.head_ref }}
